name: roomate
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  auto_route: ^10.2.0
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  import_sorter: ^4.6.0
  intl: ^0.20.2
  meta: ^1.16.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  auto_route_generator: 10.2.5
flutter:
  generate: true
  uses-material-design: true
import_sorter:
  emojis: false
  comments: false
  ignored_files:
  - lib/presentation/l10n/*
  - lib/presentation/routing/*
  - r".*g\.dart$"
  - r".*gr\.dart$"
  - r".*freezed\.dart$"

