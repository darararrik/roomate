name: roomate
description: "Roomate"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  data:
    path: data
  domain:
    path: domain
  shared:
    path: shared
  auto_route: ^11.1.0
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  import_sorter: ^4.6.0
  intl: ^0.20.2
  dropdown_button2: ^3.0.0
  group_button: ^5.3.4
  freezed_annotation: ^3.1.0
  freezed: ^3.2.5
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  provider: ^6.1.5
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0
  riverpod_annotation: ^4.0.2
  pin_code_fields: ^9.3.0
  shared_preferences: ^2.5.5

  dartz: ^0.10.1
  fluttertoast: ^9.0.0
  collection: ^1.19.1
  talker: ^5.1.16
  talker_flutter: ^5.1.16
dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: 9.0.0
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  auto_route_generator: ^10.4.0
  riverpod_generator: 4.0.3
  riverpod_lint: any

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/pics/
  fonts:
    - family: Helvetica
      fonts:
        - asset: assets/fonts/helvetica-neue-bold.ttf
          weight: 700
        - asset: assets/fonts/helvetica-neue-regular.ttf
          weight: 400
        - asset: assets/fonts/helvetica-neue-medium.ttf
          weight: 500

import_sorter:
  emojis: false
  comments: false
  ignored_files:
    - lib/l10n/*
    - lib/routing/*
    - r".*g\.dart$"
    - r".*gr\.dart$"
    - r".*freezed\.dart$"
