name: roomate
description: "Roomate"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  data:
    path: data
  domain:
    path: domain
  shared:
    path: shared
  auto_route: ^11.1.0
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  import_sorter: ^4.6.0
  intl: ^0.20.2
  dropdown_button2: ^3.0.0
  group_button: ^5.3.4
  freezed_annotation: ^3.1.0
  freezed: ^3.2.5
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  provider: ^6.1.5
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3
  riverpod_annotation: ^4.0.2
  pin_code_fields: ^9.3.0
  riverpod_lint: ^3.1.3
  dartz: ^0.10.1
  fluttertoast: ^9.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  auto_route_generator: ^10.4.0
  riverpod_generator: ^4.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/assets/icons/
    - lib/assets/pics/
    - shared/lib/mocks/omsk_streets.json
  fonts:
    - family: Helvetica
      fonts:
        - asset: lib/assets/fonts/helvetica-neue-bold.ttf
          weight: 700
        - asset: lib/assets/fonts/helvetica-neue-regular.ttf
          weight: 400
        - asset: lib/assets/fonts/helvetica-neue-medium.ttf
          weight: 500

import_sorter:
  emojis: false
  comments: false
  ignored_files:
    - lib/presentation/l10n/*
    - lib/presentation/routing/*
    - r".*g\.dart$"
    - r".*gr\.dart$"
    - r".*freezed\.dart$"
